  <text x="525" y="510" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#06b6d4" letter-spacing="0.06em" text-anchor="middle">www.norma-via.com</text>

  <!-- Tagline -->
  <text x="525" y="542" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#475569" letter-spacing="0.14em" text-anchor="middle">COMPLIANCE CONSULTING &amp; AUDIT SERVICES</text>


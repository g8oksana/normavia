<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" role="img" aria-label="NormaVia Group Business Card Back">

  <!-- Dark navy background -->
  <rect width="1050" height="600" fill="#0f172a"/>

  <!-- Cyan top accent bar -->
  <rect width="1050" height="6" fill="#06b6d4"/>

  <!-- Cyan bottom accent bar -->
  <rect y="594" width="1050" height="6" fill="#06b6d4"/>

  <!-- Subtle geometric accent (top-left, mirrored from front) -->
  <polygon points="0,0 250,0 0,250" fill="#1e293b"/>

  <!-- N icon — top center -->
  <g fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 80 L480 30 L528 80 L528 30"/>
  </g>

  <!-- NORMA VIA wordmark — top center -->
  <text x="548" y="68" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#f1f5f9" letter-spacing="0.1em">NORMA VIA</text>
  <text x="551" y="86" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#06b6d4" letter-spacing="0.35em">GROUP</text>

  <!-- Divider -->
  <line x1="350" y1="108" x2="700" y2="108" stroke="#1e293b" stroke-width="1.5"/>

  <!-- "Scan to connect" label -->
  <text x="525" y="148" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#64748b" letter-spacing="0.18em" text-anchor="middle">SCAN TO CONNECT</text>

  <!-- White background box for QR code (320x320, centered) -->
  <rect x="365" y="158" width="320" height="320" rx="12" fill="#ffffff"/>

  <!-- QR code — encodes https://www.norma-via.com
       Original viewbox: 27x27 units → scaled to 280px (scale=10.37), padded 20px inside box -->

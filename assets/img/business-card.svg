<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" role="img" aria-label="NormaVia Group Business Card">

  <!-- Dark navy background -->
  <rect width="1050" height="600" fill="#0f172a"/>

  <!-- Cyan top accent bar -->
  <rect width="1050" height="6" fill="#06b6d4"/>

  <!-- Cyan bottom accent bar -->
  <rect y="594" width="1050" height="6" fill="#06b6d4"/>

  <!-- Subtle diagonal geometric accent (bottom-right) -->
  <polygon points="800,600 1050,350 1050,600" fill="#1e293b"/>

  <!-- N icon — top left -->
  <g fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 148 L72 82 L130 148 L130 82"/>
  </g>

  <!-- NORMA VIA wordmark -->
  <text x="152" y="136" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9" letter-spacing="0.1em">NORMA VIA</text>

  <!-- GROUP subtext -->
  <text x="155" y="158" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#06b6d4" letter-spacing="0.35em">GROUP</text>

  <!-- Divider line -->
  <line x1="72" y1="192" x2="480" y2="192" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Name -->
  <text x="72" y="280" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9" letter-spacing="0.02em">Oksana Goncharov</text>

  <!-- Title -->
  <text x="72" y="328" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#06b6d4" letter-spacing="0.06em">Founder &amp; Managing Partner</text>

  <!-- Contact info — icons via simple shapes + text -->

  <!-- Website globe icon -->
  <circle cx="90" cy="424" r="11" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="413" x2="90" y2="435" stroke="#64748b" stroke-width="1.2"/>
  <line x1="79" y1="424" x2="101" y2="424" stroke="#64748b" stroke-width="1.2"/>
  <path d="M84 415 Q90 421 96 415" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M84 433 Q90 427 96 433" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="114" y="430" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.02em">www.norma-via.com</text>

  <!-- Phone icon -->
  <rect x="79" y="466" width="22" height="22" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="482" x2="90" y2="484" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="114" y="482" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.02em">(425) 381-0191</text>

  <!-- Email icon -->
  <rect x="79" y="506" width="22" height="16" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="79,508 90,518 101,508" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="114" y="520" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.02em">oksana@norma-via.com</text>

</svg>
